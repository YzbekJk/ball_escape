<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Свингейм</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- menu: home / section lists -->
<main id="menu"><div class="wrap">
  <div class="top"><button id="menuBack" title="Назад" hidden>НАЗАД</button><h1 id="menuTitle">Свингейм</h1><button class="plumBtn" id="plumBtn" title="Сливовый кликер"><span>🍑</span></button><button class="phBtn" id="phBtn" title="Закрытый раздел" aria-label="Закрытый раздел"></button><button class="accBtn" id="accBtn">👤 Войти</button></div>
  <p class="sub" id="menuSub"></p>
  <div id="cards"></div>
  <div class="online" id="online" hidden><i></i>Сейчас играет: <b>1</b></div>
  <p class="ver" id="ver"></p>
  <p class="ver" id="popCount"></p>
  </div></main>
<div id="critters"></div>

<!-- simulation view -->
<section id="view" hidden>
  <canvas id="c"></canvas>
  <div id="ovTimer" class="ov" hidden></div>
  <div id="ovText" class="ov" hidden></div>
  <div id="bar">
    <button id="btnBack" title="В меню">НАЗАД</button>
    <span class="grow"></span>
    <button id="btnLB" title="Лидерборд" hidden>РЕЙТИНГ</button>
    <button id="btnSound" title="Звук">ЗВУК ВКЛ</button>
    <button id="btnGear" title="Настройки">НАСТРОЙКИ</button>
  </div>
  <aside id="panel" hidden>
    <header><b id="panelTitle">Настройки</b><button id="btnClose" title="Закрыть">✕</button></header>
    <div id="fields"></div>
    <div class="row">
      <button id="btnRestart">Заново</button>
      <button id="btnPause">ПАУЗА</button>
    </div>
    <div class="row">
      <button id="btnDefaults">Сбросить</button>
      <button id="btnCopy">Копировать ссылку</button>
    </div>
    <p class="hint">Все изменения попадают в адрес страницы — ссылкой можно поделиться, настройки сохранятся.</p>
  </aside>
</section>

<script src="audio.js"></script>
<script src="fruit-art.js"></script>
<script src="registry.js"></script>
<script src="midi.js"></script>
<!-- simulations: add a new one by creating sims/<name>.js and listing it here -->
<script src="sims/growing-ball.js"></script>
<script src="sims/ring-escape.js"></script>
<script src="sims/will-it-escape.js"></script>
<script src="sims/adding-sides.js"></script>
<script src="sims/four-seconds.js"></script>
<script src="sims/butterfly-effect.js"></script>
<script src="sims/trampolines.js"></script>
<script src="sims/corn-farm.js"></script>
<script src="sims/physics-class.js"></script>
<script src="sims/tetris.js"></script>
<script src="skins.js"></script>
<script src="sims/rotten-bus.js"></script>
<script src="sims/pop-game.js"></script>
<script src="sims/svetofor.js"></script>
<script src="sims/bank.js"></script>
<script src="sims/plum-clicker.js"></script>
<script src="sims/peach-drop.js"></script>
<script src="sims/filipinets.js"></script>
<script src="ad.js"></script>
<script src="critters.js"></script>
<script src="supabase-config.js"></script>
<script src="lb.js"></script>
<script src="online.js"></script>
<script src="app.js"></script>
</body>
</html>
