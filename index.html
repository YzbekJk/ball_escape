<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Шарики</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- menu: home / section lists -->
<main id="menu"><div class="wrap">
  <div class="top"><button id="menuBack" title="Назад" hidden>←</button><h1 id="menuTitle">Шарики</h1></div>
  <p class="sub" id="menuSub"></p>
  <div id="cards"></div>
</div></main>

<!-- simulation view -->
<section id="view" hidden>
  <canvas id="c"></canvas>
  <div id="bar">
    <button id="btnBack" title="В меню">←</button>
    <span class="grow"></span>
    <button id="btnSound" title="Звук">🔇</button>
    <button id="btnGear" title="Настройки">⚙</button>
  </div>
  <aside id="panel" hidden>
    <header><b id="panelTitle">Настройки</b><button id="btnClose" title="Закрыть">✕</button></header>
    <div id="fields"></div>
    <div class="row">
      <button id="btnRestart">↻ Заново</button>
      <button id="btnPause">⏸ Пауза</button>
    </div>
    <div class="row">
      <button id="btnDefaults">Сбросить</button>
      <button id="btnCopy">🔗 Копировать ссылку</button>
    </div>
    <p class="hint">Все изменения попадают в адрес страницы — ссылкой можно поделиться, настройки сохранятся.</p>
  </aside>
</section>

<script src="registry.js"></script>
<!-- simulations: add a new one by creating sims/<name>.js and listing it here -->
<script src="sims/growing-ball.js"></script>
<script src="sims/ring-escape.js"></script>
<script src="sims/will-it-escape.js"></script>
<script src="sims/adding-sides.js"></script>
<script src="sims/four-seconds.js"></script>
<script src="app.js"></script>
</body>
</html>
