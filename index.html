<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Growing Ball</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="bar">
  <button id="btnSound" title="Звук">🔇</button>
  <button id="btnGear" title="Настройки">⚙</button>
</div>

<aside id="panel" hidden>
  <header><b>Настройки</b><button id="btnClose" title="Закрыть">✕</button></header>
  <div id="fields"></div>
  <div class="row">
    <button id="btnRestart">↻ Заново</button>
    <button id="btnPause">⏸ Пауза</button>
  </div>
  <div class="row">
    <button id="btnDefaults">Сбросить</button>
    <button id="btnCopy">🔗 Копировать ссылку</button>
  </div>
  <p class="hint">Все изменения попадают в адрес страницы — ссылкой можно поделиться, настройки сохранятся.</p>
</aside>

<script src="app.js"></script>
</body>
</html>
